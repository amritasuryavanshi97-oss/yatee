<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AICTE Activity Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section id="login-view" class="card">
      <h1>Welcome back</h1>
      <p class="subtitle">Log in to track your AICTE activity points.</p>
      <form id="login-form" novalidate>
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username" placeholder="e.g. aditi" required>
        <label for="password">Password</label>
        <div class="password-row">
          <input id="password" type="password" autocomplete="current-password" placeholder="Your password" required>
          <button type="button" id="toggle-password" class="ghost" aria-label="Show or hide password">Show</button>
        </div>
        <p id="login-error" class="error" role="alert" hidden></p>
        <button type="submit" id="login-btn" class="primary">Log in</button>
        <p class="hint">Demo login: <strong>aditi</strong> / <strong>demo123</strong></p>
      </form>
    </section>

    <section id="dashboard-view" class="card" hidden>
      <header class="dash-header">
        <div><p class="subtitle">Student</p><h1 id="student-name">Loading…</h1></div>
        <button id="logout-btn" class="ghost">Log out</button>
      </header>
      <div class="points"><span id="points" class="points-big">0</span><span class="points-target">/ <span id="target">100</span> points</span></div>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div id="bar" class="progress-fill"></div></div>
      <p id="goal-message" class="goal-message" hidden>Target reached! Great work 🎉</p>
      <button id="checkin-btn" class="primary big">Check in</button>
      <p class="checkin-count"><strong id="checkin-count">0</strong> check-ins so far</p>
      <h2>Recent check-ins</h2>
      <ul id="recent-list" class="recent-list"><li class="empty">No check-ins yet.</li></ul>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
